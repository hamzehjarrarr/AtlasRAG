name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The test suite covers parsing, chunking, indexing
      # manifests, prompting, and verification. It does not
      # load torch or download models, so CI installs only
      # the lightweight dependencies.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pymupdf numpy bm25s

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q